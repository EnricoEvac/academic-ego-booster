<style>
:root{color-scheme:dark;--bg:#06201a;--bg2:#0b3228;--surface:rgba(16,62,48,.58);--line:rgba(120,235,175,.17);--ink:#e8f7ef;--mute:#8dbba5;--exit:#00c46a;--exit-hi:#34f59a;--on-exit:#04251a;--err:#ff9a91;--glow:0 6px 22px -6px rgba(0,196,106,.6)}
*{box-sizing:border-box}html,body{margin:0}
body{background:radial-gradient(900px 440px at 90% -8%,rgba(0,196,106,.2),transparent 62%),radial-gradient(700px 520px at -12% 108%,rgba(0,150,90,.18),transparent 58%),var(--bg);background-attachment:fixed;color:var(--ink);font:16px/1.5 "Avenir Next","Segoe UI Variable Display","Segoe UI",Inter,system-ui,-apple-system,sans-serif;padding-top:env(safe-area-inset-top);min-height:100vh}
main{max-width:680px;margin:0 auto;padding:16px 16px calc(110px + env(safe-area-inset-bottom))}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-weight:700;font-size:14px;letter-spacing:.02em;color:var(--exit-hi)}
.logo{width:30px;height:30px;border-radius:9px;box-shadow:var(--glow)}
h1{font-size:30px;font-weight:800;margin:0;letter-spacing:-.02em;line-height:1.15}
h2{font-size:18px;font-weight:700;margin:30px 0 12px;display:flex;align-items:center;gap:10px;letter-spacing:-.01em}
h2::before{content:"";width:4px;height:18px;border-radius:2px;background:linear-gradient(var(--exit-hi),var(--exit))}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sub{color:var(--mute);font-size:14px;margin:4px 0 8px}
button{font:inherit;font-weight:600;cursor:pointer;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);border-radius:12px;padding:8px 14px;min-height:42px;transition:background .15s,transform .1s}
button:hover{background:rgba(52,245,154,.12)}button:active{transform:scale(.98)}
button.p{background:linear-gradient(135deg,var(--exit-hi),var(--exit));border:0;color:var(--on-exit);font-weight:700;box-shadow:var(--glow)}
button.p:hover{filter:brightness(1.08)}
button.l{border:0;background:none;color:var(--exit-hi);padding:4px 0;min-height:0;font-size:14px}
button:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--exit-hi);outline-offset:2px}
button:disabled{opacity:.5;cursor:default}
input{font:inherit;width:100%;border:1px solid var(--line);background:rgba(0,0,0,.28);color:var(--ink);border-radius:12px;padding:9px 14px;min-height:42px}
input::placeholder{color:var(--mute)}input:focus{border-color:var(--exit)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row input{flex:1;min-width:0}
.item{background:var(--surface);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.item.u{border-color:rgba(52,245,154,.55);background:linear-gradient(135deg,rgba(0,196,106,.24),var(--surface) 72%);box-shadow:inset 4px 0 0 var(--exit-hi),var(--glow)}
.nw{font:800 10px system-ui,sans-serif;letter-spacing:.05em;background:var(--exit-hi);color:var(--on-exit);border-radius:999px;padding:2px 7px;margin-left:8px;vertical-align:middle}
.k{font-size:14px;color:var(--mute)}.k b{color:var(--ink)}
.t{font-size:17px;font-weight:600;line-height:1.3;margin:3px 0}.t a{color:var(--ink);text-decoration:none}.t a:hover{color:var(--exit-hi)}
details{margin-top:6px}summary{cursor:pointer;color:var(--exit-hi);font-size:14px;font-weight:600}
details p{font-size:15px;margin:6px 0 0;color:#cfe8da}
.pick{display:block;width:100%;text-align:left;margin-top:8px}.pick small{display:block;color:var(--mute);font-weight:400}
.msg{font-size:14px;margin:8px 0;color:var(--mute)}.msg.e{color:var(--err)}
.empty{color:var(--mute);padding:10px 0}
.rc{display:flex;justify-content:space-between;align-items:center;gap:12px}.rc small{color:var(--mute)}
.who{display:flex;align-items:center;gap:12px}
.av{width:52px;height:52px;border-radius:50%;object-fit:cover;flex:none;background:var(--bg2);border:2px solid var(--exit);box-shadow:0 0 0 4px rgba(0,196,106,.2)}
.hero{background:linear-gradient(160deg,var(--bg2),rgba(0,196,106,.2));border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:6px;box-shadow:0 14px 40px -18px rgba(0,196,106,.5)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stats div{background:rgba(0,0,0,.28);border-radius:14px;padding:10px 6px;text-align:center}
.stats b{display:block;font-size:26px;font-weight:800;color:var(--exit-hi);line-height:1.1}.stats span{font-size:12px;color:var(--mute)}
a{color:var(--exit-hi)}.item>.l{display:block;margin-top:8px}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:calc(100% - 24px);max-width:660px;display:flex;gap:4px;padding:6px;background:rgba(6,32,26,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:22px;box-shadow:0 14px 34px rgba(0,0,0,.5)}
nav button{flex:1;border:0;border-radius:16px;background:none;min-height:46px;padding:0 2px;font-size:13px;color:var(--mute)}
nav button.on{background:linear-gradient(135deg,var(--exit-hi),var(--exit));color:var(--on-exit);font-weight:800;box-shadow:var(--glow)}
.credit{color:var(--mute);font-size:13px;margin:-6px 0 14px}
.pager{display:flex;align-items:center;gap:8px;margin:0 0 10px}.pager .sp{flex:1}.pager button{min-height:36px;min-width:40px;padding:4px 10px}
select{font:inherit;background:rgba(0,0,0,.28);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:6px 8px;min-height:36px}
nav{overflow-x:auto}nav button{flex:1 0 auto;padding:0 12px}
.seg{display:flex;gap:6px;margin:0 0 10px}.seg button{flex:1;min-height:36px;padding:4px 10px;font-size:14px}
.seg button.on{background:linear-gradient(135deg,var(--exit-hi),var(--exit));border:0;color:var(--on-exit);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;opacity:.55}.chip.on{opacity:1;border-color:var(--exit);background:rgba(0,196,106,.18)}
.chip button{border:0;border-radius:0;background:none;min-height:34px;padding:2px 10px;font-size:14px}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px 8px 4px;color:var(--mute)}.chart svg{width:100%;height:auto;display:block}
.lg{display:flex;gap:14px;flex-wrap:wrap;padding:4px 8px}.lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cmp .row{flex-direction:column}
.tbl{width:100%;border-collapse:collapse;margin:12px 0;font-size:15px}.tbl th,.tbl td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right}.tbl th:first-child{text-align:left;font-weight:600}.tbl tr.ty th{font-weight:400;padding-left:18px;color:var(--mute)}.tbl td{font-variant-numeric:tabular-nums}
.sel{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute);margin:0 0 4px}.sel input{width:auto;min-height:0}
@media (prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>

<script>
const API='https://api.openalex.org',KEY='scholarwatch.v1',STALE=30*60*1000;
const STOP=new Set(['with','from','that','this','their','using','based','study','studies','analysis','research','between','through']);
const $=s=>document.querySelector(s);
const su=u=>/^https?:\/\//i.test(String(u||''))?esc(u):'#';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S=load(),tab='home',busy=false,quota=false;const pg={},TOP={};
function X0(v){return{sort:{authors:'date',journals:'rel',topics:'rel',home:'date',...((v&&v.sort)||{})},email:(v&&v.email)||'',cmp:(v&&v.cmp)||{a:null,b:null},sc:(v&&v.sc)||{},tk:(v&&v.tk)||[]}}
function load(){try{const v=JSON.parse(localStorage.getItem(KEY))||{};return{me:v.me||null,r:v.r||[],j:v.j||[],sv:v.sv||[],cit:v.cit||{list:[],checked:0},since:v.since||0,key:v.key||'',pp:v.pp||10,use:v.use||{d:'',n:0},...X0(v)}}catch(e){return{me:null,r:[],j:[],sv:[],cit:{list:[],checked:0},since:0,key:'',pp:10,use:{d:'',n:0},...X0(null)}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const sid=u=>String(u).split('/').pop();
const CK='aeb.cache.v1',MEM=new Map();
try{for(const[k,e]of Object.entries(JSON.parse(localStorage.getItem(CK))||{}))MEM.set(k,e)}catch(e){}
function cset(k,d){MEM.set(k,{t:Date.now(),d});try{const o={};[...MEM].filter(([,e])=>JSON.stringify(e.d).length<20000).sort((a,b)=>b[1].t-a[1].t).slice(0,40).forEach(([k,e])=>o[k]=e);localStorage.setItem(CK,JSON.stringify(o))}catch(e){}}
async function api(p,ttl=10*60*1000){
  const hit=MEM.get(p);if(hit&&Date.now()-hit.t<ttl)return hit.d;
  if(quota)throw new Error('OpenAlex daily limit reached. Add a free API key in Home > Settings, or try again tomorrow');
  const day=new Date().toISOString().slice(0,10);if(S.use.d!==day)S.use={d:day,n:0};S.use.n++;
  const r=await fetch(API+p+(S.key?(p.includes('?')?'&':'?')+'api_key='+encodeURIComponent(S.key):''));
  if([402,403,409,429].includes(r.status)){quota=true;throw new Error('OpenAlex daily limit reached. Add a free API key in Home > Settings, or try again tomorrow')}
  if(!r.ok)throw new Error('OpenAlex returned '+r.status);
  const d=await r.json();cset(p,d);return d;
}
function ago(ts){const m=Math.round((Date.now()-ts)/60000);if(m<1)return'just now';if(m<60)return m+' min ago';const h=Math.round(m/60);return h<24?h+' h ago':Math.round(h/24)+' d ago'}
const inst=a=>((a.last_known_institutions||[])[0]||{}).display_name||'';
const fd=d=>!d?'':d.endsWith('-00-00')?d.slice(0,4):d;
const isNew=ts=>ts>(S.since||0),tag=ts=>isNew(ts)?'<span class="nw">New</span>':'';
const byDate=(a,b)=>String(b.d).localeCompare(String(a.d));
function abs(ix){if(!ix)return'';const a=[];for(const w in ix)for(const p of ix[w])a[p]=w;return a.join(' ').slice(0,1800)}
const av=r=>r&&r.img?'<a href="'+su(r.wp||'https://wikipedia.org')+'" target="_blank" rel="noopener" title="Photo from Wikipedia"><img class="av" src="'+esc(r.img)+'" alt="" loading="lazy"></a>':'';
function rel(p){const K=S.me&&S.me.kw;if(!K)return{s:0,m:[]};const set=new Set(((p.t||'')+' '+(p.tp||'')+' '+(p.ab||'')).toLowerCase().match(/[a-z]{4,}/g)||[]),m=[];let s=0;for(const t in K)if(set.has(t)){s+=K[t];m.push(t)}return{s,m:m.sort((a,b)=>K[b]-K[a]).slice(0,3)}}
const nW=x=>x&&x.works?Object.values(x.works).filter(w=>isNew(w[4])).length:0;
const nP=a=>a.reduce((n,j)=>n+(j.papers||[]).filter(p=>isNew(p.ts)).length,0);
const wl=(r,jn)=>Object.entries(r.works||{}).map(([id,w])=>({id,t:w[1],c:w[0],d:w[3]||(w[2]?w[2]+'-00-00':''),ts:w[4],tp:w[5]||'',jn}));

function card(p,src,extra,nosave){
  const sv=S.sv.some(x=>x.id===p.id);
  return'<div class="item'+(isNew(p.ts)?' u':'')+'"><div class="k"><b>'+esc(src)+'</b> · '+esc(fd(p.d))+tag(p.ts)+'</div><div class="t"><a href="'+su(p.doi||p.id)+'" target="_blank" rel="noopener">'+esc(p.t)+'</a></div>'+(p.au?'<div class="k">'+esc(p.au)+'</div>':'')+(extra||'')+(p.ab?'<details><summary>Abstract</summary><p>'+esc(p.ab)+'</p></details>':'')+(nosave?'':'<button class="l" data-save="'+esc(p.id)+'">'+(sv?'Remove from saved':'Save paper')+'</button>')+'</div>';
}
function addForm(kind,ph){return'<div class="add" data-kind="'+kind+'"><form class="row" autocomplete="off"><input placeholder="'+esc(ph)+'" aria-label="'+esc(ph)+'"><button class="p" type="submit">Find</button></form><div class="msg"></div><div class="picks"></div></div>'}
const rmList=(arr,kind)=>arr.length?arr.map(r=>'<div class="item"><div class="rc"><div class="who">'+av(r)+'<div><div class="t">'+esc(r.name)+'</div><small>'+esc(r.sub||'')+'</small></div></div><button class="l" data-rm="'+kind+':'+esc(r.id)+'">Unfollow</button></div></div>').join(''):'<div class="empty">Nobody here yet.</div>';
function page(a,key){const pp=S.pp,n=Math.max(1,Math.ceil(a.length/pp));pg[key]=Math.min(pg[key]||0,n-1);return a.slice(pg[key]*pp,(pg[key]+1)*pp)}
function pager(key,total){if(total<=5)return'';const pp=S.pp,n=Math.ceil(total/pp),p=Math.min(pg[key]||0,n-1);return'<div class="pager"><select data-pp aria-label="Papers per page">'+[5,10,20,50].map(x=>'<option'+(x===pp?' selected':'')+'>'+x+'</option>').join('')+'</select><span class="k">per page</span><span class="sp"></span><button data-pg="'+key+':-1"'+(p<=0?' disabled':'')+' aria-label="Previous page">‹</button><span class="k">'+(p+1)+' / '+n+'</span><button data-pg="'+key+':1"'+(p>=n-1?' disabled':'')+' aria-label="Next page">›</button></div>'}
const settings=()=>'<h2>Settings</h2><div class="item"><div class="k"><b>OpenAlex API key</b> (optional, free)</div><p class="sub" style="margin:4px 0 8px">OpenAlex gives keyless use only a tiny daily budget. Get a free key at openalex.org/settings/api. It is stored only on this device and is not included in exports.</p><form class="row" id="keyf" autocomplete="off"><input id="keyin" type="password" placeholder="'+(S.key?'Key saved (…'+esc(S.key.slice(-4))+')':'Paste your API key')+'" aria-label="OpenAlex API key"><button class="p" type="submit">Save</button>'+(S.key?'<button type="button" data-act="nokey">Remove</button>':'')+'</form><div class="msg" id="kmsg"></div><div class="k">Requests today: <b>'+(S.use.d===new Date().toISOString().slice(0,10)?S.use.n:0)+'</b> · repeat requests are served from a cache</div></div>';
const EMPTY=t=>'<div class="empty">'+t+'</div>';

function view(){
  let h='';
  if(tab==='home'){
    if(!S.me)h='<h2>Who are you?</h2><p class="sub">Find your own author profile. It becomes your home page.</p>'+addForm('me','Your name, OpenAlex ID or ORCID');
    else{
      const m=S.me,Y=new Date().getFullYear(),ws=wl(m).map(p=>{const y=+(p.d||'').slice(0,4)||Y;return{...p,cpy:p.c/Math.max(1,Y-y+1)}}).sort(S.sort.home==='cites'?(a,b)=>b.c-a.c||byDate(a,b):S.sort.home==='cpy'?(a,b)=>b.cpy-a.cpy||byDate(a,b):byDate),shown=page(ws,'home');
      h='<div class="hero"><div class="who">'+av(m)+'<div class="sub" style="margin:0">'+esc(m.inst||'No institution listed')+'</div></div><div class="stats"><div><b>'+(m.total||0)+'</b><span>Papers</span></div><div><b>'+(m.cites||0)+'</b><span>Citations</span></div><div><b>'+(m.h!=null?m.h:'–')+'</b><span>h-index</span></div></div></div>'
      +homeCharts()+'<h2>Your papers</h2>'+sortbar('home',[['date','Newest'],['cites','Most cited'],['cpy','Citations per year']])+pager('home',ws.length)+shown.map(p=>'<div class="item'+(isNew(p.ts)?' u':'')+'"><div class="t"><a href="'+su(p.id)+'" target="_blank" rel="noopener">'+esc(p.t)+'</a></div><div class="k">'+esc(fd(p.d))+' · '+p.c+' citation'+(p.c===1?'':'s')+' · '+p.cpy.toFixed(1)+' per year'+tag(p.ts)+'</div></div>').join('')
      +pager('home',ws.length)
      +'<h2>Backup</h2><p class="sub">Your lists are saved on this device. Export a copy to keep it safe or move it.</p><div class="row"><button id="exp">Export</button><button id="imp">Import</button><button id="chg">Change profile</button><input type="file" id="file" accept=".json" hidden></div><div class="msg" id="bmsg"></div>';
    }
    h+=settings();
  }else if(tab==='cites'){
    const l=(S.cit.list||[]);
    h='<h2>Papers citing your work, newest first</h2>'+(!S.me?EMPTY('Set your profile on the Home tab first.'):l.length?pager('cites',l.length)+page(l,'cites').map(p=>card(p,'Cites you',(p.of&&p.of.length?'<div class="k">Cites: '+esc(p.of.join('; '))+'</div>':''))).join('')+pager('cites',l.length)+'<p class="sub">Showing the 60 most recent citing papers found in OpenAlex.</p>':EMPTY('No citations found yet.'));
  }else if(tab==='authors'){
    const ps=S.r.flatMap(r=>wl(r,r.name)).map(p=>({...p,r:rel(p)})).sort(cmpBy('authors')).slice(0,100);
    h='<h2>Latest papers from authors you follow</h2>'+sortbar('authors')+(ps.length?pager('authors',ps.length)+page(ps,'authors').map(p=>card(p,p.jn,'<div class="k">'+p.c+' citation'+(p.c===1?'':'s')+'</div>'+(p.r.m.length?'<div class="k">Matches your research: '+esc(p.r.m.join(', '))+'</div>':''),true)).join('')+pager('authors',ps.length):EMPTY('Follow researchers to see their most recent papers.'))
    +'<h2>Authors you follow</h2>'+rmList(S.r.map(r=>({id:r.id,name:r.name,img:r.img,wp:r.wp,sub:(r.inst||'No institution')+' · '+(r.total||0)+' papers'})),'a')
    +'<h2>Follow an author</h2>'+addForm('author','Name, OpenAlex ID or ORCID');
  }else if(tab==='journals'){
    const ps=S.j.flatMap(j=>(j.papers||[]).map(p=>({...p,jn:j.name,r:rel(p)}))).sort(cmpBy('journals')).slice(0,200);
    h='<h2>New in your journals</h2>'+sortbar('journals')
    +(ps.length?pager('journals',ps.length)+page(ps,'journals').map(p=>card(p,p.jn,p.r.m.length?'<div class="k">Matches your research: '+esc(p.r.m.join(', '))+'</div>':'')).join('')+pager('journals',ps.length):EMPTY('Follow a journal to see its latest papers with abstracts.'))
    +'<h2>Journals you follow</h2>'+rmList(S.j.map(j=>({id:j.id,name:j.name,img:j.img,wp:j.wp,sub:j.sub})),'j')
    +'<h2>Follow a journal</h2>'+addForm('journal','Journal name or ISSN');
  }else if(tab==='topics'){h=topicsView()
  }else if(tab==='compare'){h=cmpView()
  }else{
    h='<h2>Saved papers</h2>'+(S.sv.length?emailPanel()+pager('saved',S.sv.length)+page(S.sv,'saved').map(p=>'<label class="sel"><input type="checkbox" data-sel="'+esc(p.id)+'"'+(NOSEL.has(p.id)?'':' checked')+'> Include in email</label>'+card({...p,ts:0},p.jn||'Saved')).join('')+pager('saved',S.sv.length):EMPTY('Tap “Save paper” on any journal or citation result to keep it here.'));
  }
  $('#view').innerHTML=(tab==='home'?'<p class="credit">Developed by Enrico Ronchi</p>':'')+h;
  const nb=[['home','Home',nW(S.me)],['cites','Citations',(S.cit.list||[]).filter(p=>isNew(p.ts)).length],['authors','Authors',S.r.reduce((n,r)=>n+nW(r),0)],['journals','Journals',nP(S.j)],['topics','Topics',0],['compare','Compare',0],['saved','Saved',0]];
  $('#nav').innerHTML=nb.map(([k,l,n])=>'<button data-tab="'+k+'" class="'+(tab===k?'on':'')+'">'+l+(n?' ('+n+')':'')+'</button>').join('');
  const un=nb.reduce((n,x)=>n+x[2],0);document.title=(un?'('+un+') ':'')+'Academic Ego Booster';
  $('#ttl').textContent={home:S.me?S.me.name:'Welcome',cites:'Citations',authors:'Authors',journals:'Journals',topics:'Topics',compare:'Compare',saved:'Saved'}[tab];
  const all=[S.me,...S.r,...S.j].filter(Boolean),last=all.length?Math.max(...all.map(x=>x.checked||0)):0;
  if(last)$('#status').textContent='Last checked '+ago(last);
}

async function getImg(r){
  r.imgTried=Date.now();r.img='';
  try{
    const a=await api('/authors/'+r.id+'?select=ids,display_name'),w=a.ids&&a.ids.wikipedia;
    const base=w?new URL(w).origin:'https://en.wikipedia.org',title=w?decodeURIComponent(sid(w)):a.display_name.replace(/ /g,'_');
    const j=await (await fetch(base+'/api/rest_v1/page/summary/'+encodeURIComponent(title))).json();
    const src=j.thumbnail&&j.thumbnail.source;
    if(j.type!=='standard'||!src||!/(^|\.)wikimedia\.org$/.test(new URL(src).hostname))return;
    if(!w&&!/professor|researcher|scientist|physicist|chemist|biologist|mathematician|engineer|academic|economist|psychologist|astronomer|historian|philosopher|sociologist|linguist|neuroscientist/i.test((j.description||'')+' '+(j.extract||'').slice(0,300)))return;
    r.img=src;r.wp=(j.content_urls&&j.content_urls.desktop&&j.content_urls.desktop.page)||'';
  }catch(e){r.img=''}
}
async function fetchWorks(id){let o=[];for(let p=1;p<=3;p++){const j=await api('/works?filter=author.id:'+id+'&per-page=200&page='+p+'&select=id,title,cited_by_count,publication_year,publication_date,topics');o.push(...j.results);if(j.results.length<200)break}return o}
const DAY=864e5,slim=w=>[w.cited_by_count||0,w.title||'Untitled',w.publication_year,w.publication_date],WSEL='&select=id,title,cited_by_count,publication_year,publication_date,topics';
async function getJImg(j){
  j.imgTried=Date.now();j.img='';

document.addEventListener('click',async ev=>{
  const t=ev.target,pick=t.closest('.pick');
  if(pick){
    const box=pick.closest('.add'),a=box._res[pick.dataset.i],kind=box.dataset.kind,id=sid(a.id);
    if(kind==='journal'){if(S.j.some(x=>x.id===id)){setMsg(box,'You already follow this journal.',true);return}S.j.push({id,name:a.display_name,sub:a.host_organization_name||'',wd:(a.ids&&a.ids.wikidata)||'',papers:[],seen:null,checked:0})}
    else if(kind==='cmpa'||kind==='cmpb'){S.cmp[kind[3]]={id,name:a.display_name,inst:inst(a)};save();view();await loadCmp();return}
    else if(kind==='me'){S.me={id,name:a.display_name,inst:inst(a),works:null,total:a.works_count,cites:a.cited_by_count,checked:0};S.r=S.r.filter(x=>x.id!==id);S.cit={list:[],checked:0}}
    else{if(S.r.some(x=>x.id===id)||(S.me&&S.me.id===id)){setMsg(box,'Already in your list.',true);return}S.r.push({id,name:a.display_name,inst:inst(a),works:null,total:a.works_count,cites:a.cited_by_count,checked:0})}
    save();view();await refresh();return;
  }
  if(t.dataset.tab){tab=t.dataset.tab;view();scrollTo(0,0);if(tab==='compare'&&[S.cmp.a,S.cmp.b].some(x=>x&&!S.sc[x.id]))loadCmp();return}
  if(t.dataset.act==='nokey'){S.key='';save();view();return}
  if(t.dataset.act==='tsearch'){await runTopics();return}
  if(t.dataset.act==='tkme'){const K=(S.me&&S.me.kw)||{};for(const k of Object.keys(K).sort((a,b)=>K[b]-K[a]).slice(0,6))if(!S.tk.some(x=>x.k===k))S.tk.push({k,on:true});save();view();return}
  if(t.dataset.tk!==undefined){const i=+t.dataset.tk;S.tk[i].on=!S.tk[i].on;save();view();return}
  if(t.dataset.tkx!==undefined){S.tk.splice(+t.dataset.tkx,1);save();view();return}
  if(t.dataset.clr){S.cmp[t.dataset.clr]=null;save();view();return}
  if(t.dataset.cme&&S.me){S.cmp.a={id:S.me.id,name:S.me.name,inst:S.me.inst};save();view();await loadCmp();return}
  if(t.dataset.sort){const[k,v]=t.dataset.sort.split(':');S.sort[k]=v;for(const x in pg)pg[x]=0;save();view();return}
  if(t.dataset.act==='selall'){NOSEL.clear();view();return}
  if(t.dataset.act==='selnone'){S.sv.forEach(p=>NOSEL.add(p.id));view();return}
  if(t.dataset.act==='mail'){const ps=picked();if(!ps.length)return emsg('Select at least one paper.');if(!S.email)return emsg('Enter and save your email above first.');
    const m=mailURL(ps),a=document.createElement('a');a.href=m.url;document.body.appendChild(a);a.click();a.remove();emsg('Opening your email app…'+(m.cut?' The BibTeX was too long for the message body, so use Share .bib file or Copy BibTeX as well.':''));return}
  if(t.dataset.act==='bibshare'){const ps=picked();if(!ps.length)return emsg('Select at least one paper.');
    const f=new File([bibs(ps)],'saved-papers.bib',{type:'text/plain'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:'Saved papers (BibTeX)',text:lst(ps)});return emsg('Shared.')}catch(e){if(e.name==='AbortError')return}}
    const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download='saved-papers.bib';document.body.appendChild(a);a.click();a.remove();emsg('Tried to download saved-papers.bib. If nothing appears in your downloads, use Copy BibTeX.');return}
  if(t.dataset.act==='bibcopy'){const ps=picked();if(!ps.length)return emsg('Select at least one paper.');try{await navigator.clipboard.writeText(bibs(ps));emsg('BibTeX copied. Paste it into a .bib file or an email.')}catch(e){emsg('Copying is not available here. Use Email list + BibTeX instead.')}return}
  
  if(t.dataset.pg){const[k,d]=t.dataset.pg.split(':');pg[k]=(pg[k]||0)+ +d;view();scrollTo(0,0);return}
  if(t.dataset.save){const id=t.dataset.save;
    if(S.sv.some(x=>x.id===id))S.sv=S.sv.filter(x=>x.id!==id);
    else{const p=findP(id);if(p)S.sv.unshift({id:p.id,t:p.t,d:p.d,doi:p.doi,au:p.au,aus:p.aus||[],v:p.v||'',ty:p.ty||'',ab:p.ab||'',jn:p.jn})}
    const y=scrollY;save();view();scrollTo(0,y);return}
  if(t.dataset.rm){const[k,id]=t.dataset.rm.split(':'),x=(k==='a'?S.r:S.j).find(y=>y.id===id);
    if(x&&confirm('Unfollow '+x.name+'?')){if(k==='a')S.r=S.r.filter(y=>y.id!==id);else S.j=S.j.filter(y=>y.id!==id);save();view()}return}
  if(t.id==='chg'&&confirm('Change your profile? Your followed authors and journals stay.')){S.me=null;S.cit={list:[],checked:0};save();view();return}
  if(t.id==='exp'){
    const d=JSON.stringify({app:'scholar-watch',v:3,me:S.me&&{id:S.me.id,name:S.me.name,inst:S.me.inst},r:S.r.map(r=>({id:r.id,name:r.name,inst:r.inst})),j:S.j.map(j=>({id:j.id,name:j.name,sub:j.sub})),sv:S.sv},null,2);
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([d],{type:'application/json'}));a.download='academic-ego-booster-list.json';document.body.appendChild(a);a.click();a.remove();
    $('#bmsg').textContent='Exported your profile, '+S.r.length+' author(s), '+S.j.length+' journal(s) and '+S.sv.length+' saved paper(s).';return}
  if(t.id==='imp'){$('#file').click();return}
});
document.addEventListener('change',async ev=>{
  if(ev.target.dataset.sel!==undefined){const id=ev.target.dataset.sel;ev.target.checked?NOSEL.delete(id):NOSEL.add(id);const y=scrollY;view();scrollTo(0,y);return}
  if(ev.target.dataset.pp!==undefined){S.pp=+ev.target.value;for(const k in pg)pg[k]=0;save();view();return}
  if(ev.target.id!=='file')return;const f=ev.target.files[0];ev.target.value='';if(!f)return;
  try{const j=JSON.parse(await f.text());if(j.app!=='scholar-watch')throw new Error('This is not a Academic Ego Booster export');
    const mk=(x,extra)=>({id:x.id,name:String(x.name||x.id),...extra,checked:0});let n=0;
    if(j.me&&!S.me&&/^A\d+$/.test(j.me.id)){S.me=mk(j.me,{inst:String(j.me.inst||''),works:null,total:0,cites:0});n++}
    for(const x of j.r||[])if(x&&/^A\d+$/.test(x.id)&&!S.r.some(y=>y.id===x.id)&&!(S.me&&S.me.id===x.id)){S.r.push(mk(x,{inst:String(x.inst||''),works:null,total:0,cites:0}));n++}
    for(const x of j.j||[])if(x&&/^S\d+$/.test(x.id)&&!S.j.some(y=>y.id===x.id)){S.j.push(mk(x,{sub:String(x.sub||''),papers:[],seen:null}));n++}
    for(const x of j.sv||[])if(x&&typeof x.id==='string'&&typeof x.t==='string'&&!S.sv.some(y=>y.id===x.id)){S.sv.push({id:x.id,t:x.t,d:String(x.d||''),doi:String(x.doi||''),au:String(x.au||''),ab:String(x.ab||'').slice(0,1800),jn:String(x.jn||''),aus:Array.isArray(x.aus)?x.aus.map(String).slice(0,30):[],v:String(x.v||''),ty:String(x.ty||'')});n++}
    save();view();$('#bmsg').textContent=n?'Imported '+n+' item(s). Saving a baseline…':'Nothing new to import.';if(n)await refresh()
  }catch(e){$('#bmsg').textContent=e.message+'. Choose a file exported from this app.'}
});
$('#refresh').onclick=()=>refresh(true);
function closing(){S.since=Date.now();save()}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')closing();else if(stale())refresh()});
addEventListener('pagehide',closing);
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
view();if(stale())refresh();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
