name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract web ZIP into www and prepare icon
        run: |
          mkdir -p www assets
          unzip -q academic-ego-booster-clean.zip -d extracted
          WEB_DIR=$(find extracted -name "index.html" -exec dirname {} \; | head -n 1)
          cp -r "$WEB_DIR"/. www/
          if [ -f "www/icon-1024.png" ]; then
            cp www/icon-1024.png assets/logo.png
          elif [ -f "www/icon-512.png" ]; then
            cp www/icon-512.png assets/logo.png
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Initialize Capacitor and Add iOS
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          npx cap telemetry off
          npx cap init "Academic Ego Booster" "com.example.egobooster" --web-dir=www
          npx cap add ios
          npm install -D @capacitor/assets
          npx @capacitor/assets generate --ios --iconBackgroundColor '#052119' --iconBackgroundColorDark '#052119' --splashBackgroundColor '#052119' --splashBackgroundColorDark '#052119'
          npx cap sync ios

      - name: Build Unsigned Archive
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/App.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package into IPA
        run: |
          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build && zip -r ../AcademicEgoBooster.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AcademicEgoBooster-iOS
          path: AcademicEgoBooster.ipa
